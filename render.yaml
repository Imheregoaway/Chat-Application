# Deploy on Render: https://render.com
# Dashboard → New → Blueprint → connect this GitHub repo
services:
  - type: web
    name: ai-chat-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: HF_PROVIDER
        value: featherless-ai
      - key: HF_CHAT_MODEL
        value: HuggingFaceH4/zephyr-7b-beta
      - key: HF_EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: CHROMA_PERSIST_DIR
        value: ./chroma_data
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: "8000"
