name: chat_application
description: "AI Chat Application — Flutter UI + Python backend (LangGraph, ChromaDB, Hugging Face)"
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_fonts: ^8.1.0
  flutter_animate: ^4.5.2
  intl: ^0.20.2
  uuid: ^4.5.1
  http: ^1.2.2
  shared_preferences: ^2.3.3
  speech_to_text: ^7.0.0
  file_picker: ^8.1.6
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
